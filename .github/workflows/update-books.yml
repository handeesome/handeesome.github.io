name: Convert CSV to JSON

on:
  push:
    paths:
      - "src/data/books/books.csv" # Fixed path
  workflow_dispatch: # Add manual trigger

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions: # Add permissions for newer GitHub
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4 # Updated version
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11" # Updated version

      - name: Run conversion script
        run: python actions/convert-CSV/convert-CSV.py

      - name: Check for changes
        id: verify-changed-files
        run: |
          if git diff --quiet src/data/books/books.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.name 'github-actions[bot]'
          git config --local user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data/books/books.json
          git commit -m "📚 Update books.json from books.csv"
          git push
