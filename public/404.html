<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Debugging Redirect...</title>
    <script type="text/javascript">
      // Debug version - shows what's happening
      console.log("404.html loaded");
      console.log("Current URL:", window.location.href);
      console.log("Pathname:", window.location.pathname);
      console.log("Search:", window.location.search);
      console.log("Hash:", window.location.hash);

      // GitHub Pages SPA redirect script
      var pathSegmentsToKeep = 0;
      var l = window.location;

      // Build the redirect URL
      var redirectUrl =
        l.protocol +
        "//" +
        l.hostname +
        (l.port ? ":" + l.port : "") +
        l.pathname
          .split("/")
          .slice(0, 1 + pathSegmentsToKeep)
          .join("/") +
        "/?/" +
        l.pathname
          .slice(1)
          .split("/")
          .slice(pathSegmentsToKeep)
          .join("/")
          .replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash;

      console.log("Redirecting to:", redirectUrl);

      // Show debug info on page for 3 seconds before redirecting
      document.addEventListener("DOMContentLoaded", function () {
        document.getElementById("debug-info").innerHTML = `
        <p><strong>Original URL:</strong> ${l.href}</p>
        <p><strong>Redirecting to:</strong> ${redirectUrl}</p>
        <p><strong>Pathname:</strong> ${l.pathname}</p>
        <p>Redirecting in 3 seconds...</p>
      `;

        setTimeout(function () {
          l.replace(redirectUrl);
        }, 3000);
      });
    </script>
  </head>
  <body>
    <div
      style="text-align: center; padding: 50px; font-family: Arial, sans-serif">
      <h2>404 - Debugging Redirect</h2>
      <div id="debug-info">Loading debug info...</div>
      <p><a href="/">Go to Home</a></p>
    </div>
  </body> </html
